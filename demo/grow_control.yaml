dataset:
  pdb_paths:
    - ./demo/data/mol_grow/cplx.cif
  tgt_chains:
    - AB
  lig_chains:
    - L

templates:
  # molecule growing
  - class: MoleculeCompletion
    fragment_sdf: ./demo/data/mol_grow/anchor_1.sdf
    block_centers:
      - [18.0, 25.0, 20.0]
      - [15.0, 24.0, 18.0]
      - [13.0, 20.5, 13.0]
      - [13.0, 19.0, 19.0]
      - [9.0, 19.0, 12.5]
    block_center_stds: [1.0, 1.0, 2.0, 2.0, 1.0]
    add_block_size_min: 6
    add_block_size_max: 10  # additional random blocks other than the specified ones: [1, 5)


batch_size: 16
n_samples: 50  # top-50 candidates for each complex
